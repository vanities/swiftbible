name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/realm/swiftlint:0.57.0
    steps:
      - uses: actions/checkout@v5
      # Warnings are surfaced inline but only errors fail the job.
      - name: Lint
        run: swiftlint lint --reporter github-actions-logging

  ios-unit-tests:
    name: iOS unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Pick a simulator
        id: sim
        run: |
          # Use whatever iPhone simulator the selected Xcode ships — device
          # names change with every Xcode release.
          NAME=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+( Pro| Pro Max| Plus|e)?' | head -1)
          echo "Using simulator: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/swiftbible.xcodeproj \
            -scheme swiftbible \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -only-testing:swiftbibleTests \
            CODE_SIGNING_ALLOWED=NO \
            | tail -200

  android-unit-tests:
    name: Android unit tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Android Lint
        working-directory: android
        run: ./gradlew :app:lintDebug --console=plain
