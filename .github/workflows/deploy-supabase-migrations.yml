name: Deploy Supabase Database Migrations

on:
  workflow_call:
    inputs:
      serialized_by_caller:
        type: boolean
        default: false
  workflow_dispatch:

# Reusable calls already run inside the parent's production lock. Manual
# migration runs acquire that same lock; re-acquiring it in a child deadlocks.
concurrency:
  group: ${{ inputs.serialized_by_caller && format('supabase-migrations-{0}', github.run_id) || 'supabase-production' }}
  cancel-in-progress: false

jobs:
  deploy-migrations:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          # Pinned: `latest` picked up CLI 3.0 (2026-11-02), which rejects the
          # [inbucket] section in supabase/config.toml, and the deploy of #45
          # failed. Matches the local CLI. Move to 3.x together with
          # deploy-supabase-functions.yml, after renaming inbucket to local_smtp.
          version: 2.122.0

      - name: Link Supabase project
        run: |
          supabase link --project-ref "$PROJECT_ID"

      - name: Push database migrations
        run: |
          supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Verify migration status
        run: |
          echo "Checking migration status..."
          supabase migration list
