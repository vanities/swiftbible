name: Deploy Supabase Edge Functions

on:
  push:
    branches: [master]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Deploy create-donation-session WITHOUT JWT verification (anonymous donations only)
      - name: Deploy create-donation-session function
        run: supabase functions deploy create-donation-session --project-ref "$PROJECT_ID" --no-verify-jwt

      # Deploy donation-status WITHOUT JWT verification (anonymous donations only)
      - name: Deploy donation-status function
        run: supabase functions deploy donation-status --project-ref "$PROJECT_ID" --no-verify-jwt

      # Deploy donation-history WITHOUT JWT verification (anonymous donations only)
      - name: Deploy donation-history function
        run: supabase functions deploy donation-history --project-ref "$PROJECT_ID" --no-verify-jwt

      # Deploy stripe-donation-webhook WITHOUT JWT verification (called by Stripe webhooks)
      - name: Deploy stripe-donation-webhook function
        run: supabase functions deploy stripe-donation-webhook --project-ref "$PROJECT_ID" --no-verify-jwt

      # Deploy record-storekit-donation WITH JWT verification (called from authenticated app)
      - name: Deploy record-storekit-donation function
        run: supabase functions deploy record-storekit-donation --project-ref "$PROJECT_ID"

      # Deploy user-self-deletion WITH JWT verification (called from authenticated frontend)
      - name: Deploy user-self-deletion function
        run: supabase functions deploy user-self-deletion --project-ref "$PROJECT_ID"

      # Deploy daily-devotional WITH JWT verification (called by cron job with service role)
      - name: Deploy daily-devotional function
        run: supabase functions deploy daily-devotional --project-ref "$PROJECT_ID"

      # Deploy get-daily-devotional WITHOUT JWT verification (called by mobile clients)
      - name: Deploy get-daily-devotional function
        run: supabase functions deploy get-daily-devotional --project-ref "$PROJECT_ID" --no-verify-jwt
