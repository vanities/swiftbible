    • यीशु के शब्द वाक्यांश स्तर पर लाल रंग में
    • AI व्याख्या के लिए लंबे समय तक दबाएं (Apple Intelligence)
    • सभी अनुवादों में पूर्ण-पाठ खोज
    • अध्याय और छंद सारांश

    दैनिक ध्यान, लाइट/डार्क मोड, समायोज्य फ़ॉन्ट और पूर्ण VoiceOver समर्थन।

