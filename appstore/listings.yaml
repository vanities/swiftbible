  description: |
    SwiftBible ist eine Open-Source-Bibel-App für iOS, sorgfältig gestaltet für ernsthafte Leser und Studenten der Heiligen Schrift.

    Vier gemeinfreie Übersetzungen:
    • King James Version (KJV) — die zeitlose Übersetzung von 1611
    • American Standard Version (ASV) — die wörtlichste englische Bibel
    • World English Bible (WEB) — modern, genau und lesbar
    • Hebräisch (AT) und Griechisch (NT) — Schrift in den Ursprungssprachen mit Rechts-nach-Links-Darstellung

    Über den Kanon hinaus die ganze Bibliothek studieren:
    • Deuterokanonische Apokryphen (Makkabäer, Weisheit, Sirach, u.a.)
    • 1 Henoch und 2 Henoch (Wächter, Bilderreden, Astronomisches Buch — 108 Kapitel)
    • Buch der Jubiläen
    • Testamente der Zwölf Patriarchen
    • Didache und 1 Klemensbrief

    Studienwerkzeuge für den täglichen Gebrauch:
    • Verse mit eigenen Farben markieren
    • Persönliche Notizen zu jedem Vers
    • Worte Jesu phrasenweise in Rot
    • Langes Drücken für KI-Erklärungen (Apple Intelligence)
    • Volltextsuche über alle Übersetzungen
    • Kapitel- und Verszusammenfassungen

    Tägliche Andachten, helle und dunkle Modi, einstellbare Schriften und vollständige VoiceOver-Unterstützung.

    SwiftBible ist vollständig Open Source. Code ansehen und beitragen auf GitHub.
