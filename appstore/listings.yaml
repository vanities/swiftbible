    SwiftBible es una aplicación de Biblia para iOS de código abierto, bellamente diseñada para lectores y estudiantes serios de las Escrituras.

    Cuatro traducciones de dominio público:
    • King James Version (KJV) — la atemporal traducción de 1611
    • American Standard Version (ASV) — la Biblia inglesa más literal
