    • Apócrifos deuterocanónicos (Macabeos, Sabiduría, Sirácide y más)
    • 1 Enoc y 2 Enoc (Vigilantes, Parábolas, Libro Astronómico — 108 capítulos)
    • Libro de los Jubileos
    • Testamentos de los Doce Patriarcas
    • Didaché y 1 Clemente

    Herramientas de estudio para uso diario:
    • Resalta versículos con colores personalizados
    • Toma notas personales en cualquier versículo
    • Las palabras de Jesús destacadas en rojo
    • Mantén pulsado para explicaciones con IA (Apple Intelligence)
    • Búsqueda de texto completo en todas las traducciones
    • Resúmenes de capítulo y versículo

    Devocionales diarios, modos claro y oscuro, fuentes ajustables y soporte completo de VoiceOver.

    SwiftBible es totalmente de código abierto. Lee y contribuye al código en GitHub.
