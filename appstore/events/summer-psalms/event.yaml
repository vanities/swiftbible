# Summer in the Psalms 2026 — In-App Event copy
# ----------------------------------------------------------------
# Paste into App Store Connect → SwiftBible → In-App Events (or push via
# `make push-event EVENT=summer-psalms`).
# Field limits: name 30, short 50, long 120 (per Apple's IAE spec).
# ----------------------------------------------------------------

reference_name: "Summer in the Psalms 2026"   # private, ASC-only
event_type: "Challenge"                        # 30-day reading goal → CHALLENGE badge
priority: "HIGH"
purpose: "Appropriate for All Users"
purchase_requirement: "FREE"
primary_locale: "en-US"

# Schedule: a 30-day plan, one psalm a day, July 1–30. Card visible a few days
# early. event_start = day 1 so the store's "opens" date matches the in-app
# unlock (unlike Pentecost, whose event_start trailed the plan by a week).
schedule:
  start: "2026-06-28 00:00 UTC"
  end:   "2026-07-30 23:59 UTC"
  publish_start: "2026-06-28 00:00 UTC"   # when the IAE card becomes visible
  event_start: "2026-07-01 00:00 UTC"      # day 1 unlocks
  event_end: "2026-07-30 23:59 UTC"

deep_link: "swiftbible://event/summer-psalms"

notification_opt_in: |
  Get a daily psalm and a short reflection, all July long.

