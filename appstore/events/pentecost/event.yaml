# Pentecost 2026 — In-App Event copy
# ----------------------------------------------------------------
# Paste these values into App Store Connect → SwiftBible → In-App Events.
# Field limits: name 30, short 50, long 120 (per Apple's IAE spec).
# ----------------------------------------------------------------

reference_name: "Pentecost 2026"   # private, ASC-only
event_type: "Special Event"
priority: "HIGH"
purpose: "Appropriate for All Users"
purchase_requirement: "FREE"
primary_locale: "en-US"

# Schedule: a week before through a week after Pentecost Sunday (Jun 1, 2026).
schedule:
  start: "2026-05-25 00:00 UTC"
  end:   "2026-06-07 23:59 UTC"
  publish_start: "2026-05-25 00:00 UTC"   # when the IAE card becomes visible
  event_start: "2026-06-01 00:00 UTC"      # the actual event moment
  event_end: "2026-06-07 23:59 UTC"

deep_link: "swiftbible://verse/Acts/2/1"
# (Or: swiftbible://event/pentecost  if you add a curated event view — see SETUP.md)

notification_opt_in: |
  Get a daily reading notification through Pentecost week.

